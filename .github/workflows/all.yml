on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

env:
   PERL_USE_UNSAFE_INC: 0
   AUTHOR_TESTING: 1
   AUTOMATED_TESTING: 1
   RELEASE_TESTING: 1
   PERL_CARTON_PATH: $GITHUB_WORKSPACE/local

jobs:
  linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.36'
          - '5.34'
          - '5.32'
          - '5.30'
          - '5.28'
          - '5.26'
          - '5.24'
          - '5.22'
          - '5.20'
          - '5.18'
          - '5.16'
          - '5.14'
          - '5.12'
          - '5.10'
          - '5.8'

    container:
      image: perldocker/perl-tester:${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: cpanm --notest --installdeps --with-configure --with-develop .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make -j3 -j3
      - name: Run Tests
        run: prove -wlvmb t
        env:
            PERL_DL_NONLAZY: 1

  linux-specialperls:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.020.003'
          - '5.022.004'
          - '5.024.004'
          - '5.026.003'
          - '5.028.003'
          - '5.030.003'
          - '5.032.001'
          - '5.034.000'
        perl-type:
#          - 'main-longdouble-buster'
          - 'main-quadmath-buster'
#          - 'main-threaded-buster'

    container:
      image: simcop2387/perl-tester:${{ matrix.perl-version }}-${{ matrix.perl-type }}

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - run: perl -V
      - name: Use archived Debian repositories
        run: |
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y curl
      - name: Install Dependencies
        run: curl -L https://cpanmin.us | perl - --notest --installdeps --with-configure --with-develop .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make -j3 -j3
      - name: Run Tests
        run: prove -wlvmb t
        env:
            PERL_DL_NONLAZY: 1

  linux-centos7:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Run tests on CentOS 7
        run: |
          docker run --rm --interactive --mount type=bind,source=$(pwd),target=/host centos:centos7 bash -c '
            set -e
            sed -i \
              -e "s|^mirrorlist=|#mirrorlist=|" \
              -e "s|^#baseurl=http://mirror.centos.org/centos/\$releasever|baseurl=https://vault.centos.org/7.9.2009|" \
              /etc/yum.repos.d/CentOS-*.repo
            yum -y install https://packages.endpointdev.com/rhel/7/os/x86_64/endpoint-repo.x86_64.rpm
            yum -y update
            yum install -y git make gcc curl perl-ExtUtils-MakeMaker
            cd /host
            perl -V
            curl https://cpanmin.us | perl - --notest --installdeps --with-configure --with-develop .
            perl Makefile.PL
            make -j3 -j3
            PERL_DL_NONLAZY=1 prove -wlvmb t
          '

  mac:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Set up Perl
        run: brew install perl
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: curl -L https://cpanmin.us | perl - --notest --installdeps --with-develop --with-configure .
      - name: perl Makefile.PL
        run: perl Makefile.PL
      - name: make
        run: make -j3 -j3
      - name: Run tests (with coverage)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://cpanmin.us | perl - --notest Devel::Cover::Report::Coveralls
          `perl -MConfig -E'print $Config::Config{"sitebin"}'`/cover -test -report Coveralls -ignore_re easyxs -ignore_re inline

  qemu-alpine:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: i386
            docker: linux/386
          - name: arm32v6
            docker: linux/arm/v6
          - name: arm32v7
            docker: linux/arm/v7
          - name: arm64v8
            docker: linux/arm64
          - name: s390x
            docker: linux/s390x

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Run tests on ${{ matrix.platform.name }}
        run: docker run --rm --interactive --platform ${{ matrix.platform.docker }} --mount type=bind,source=$(pwd),target=/host alpine sh -c "apk add curl wget perl perl-dev make gcc libc-dev; cd /host; perl -V; curl -L https://cpanmin.us | perl - --verbose --notest --installdeps --with-configure .; perl Makefile.PL; make -j3 -j3; PERL_DL_NONLAZY=1 prove -wlvmb t"

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - name: Set up Perl
        run: |
          choco install strawberryperl
          #echo "##[add-path]C:\strawberry\c\bin;C:\strawberry\perl\site\bin;C:\strawberry\perl\bin"
          echo 'C:\strawberry\c\bin' >> $GITHUB_PATH
          echo 'C:\strawberry\perl\site\bin' >> $GITHUB_PATH
          echo 'C:\strawberry\perl\bin' >> $GITHUB_PATH
      - name: perl -V
        run: perl -V
      - name: Install Dependencies
        run: curl -L https://cpanmin.us > cpanminus.pl
      - run: perl cpanminus.pl --notest --installdeps --with-develop --with-configure --verbose .
      - run: |
          $env:PATH = "C:\Strawberry\c\bin;$env:PATH"
          perl Makefile.PL CC=C:/Strawberry/c/bin/gcc.exe LD=C:/Strawberry/c/bin/g++.exe
      - run: gmake
      - name: Run Tests
        run: prove -wlvmb t

  cygwin:
    runs-on: windows-latest

    steps:
      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@master
        with:
            packages: perl perl-ExtUtils-MakeMaker make gcc-g++ libcrypt-devel libnsl-devel bash
      - uses: actions/checkout@v4
        with:
            submodules: recursive
      - shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
            perl -V
            cpan -T App::cpanminus
            cd $GITHUB_WORKSPACE;
            cpanm --verbose --notest --installdeps --with-configure --with-develop .
            perl Makefile.PL
            make -j3 -j3 test

